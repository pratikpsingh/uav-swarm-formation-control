[project]
name = "uav-swarm-control"
version = "0.1.0"
description = "A reproducible research platform for multi-UAV formation control"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.3",
    "pyyaml>=6.0.2",
    "torch>=2.7,<3",
]

[project.optional-dependencies]
dmpc = ["scipy>=1.16,<2"]
simulation = ["gym-pybullet-drones"]
deployment = [
    "torchao>=0.17,<0.18",
]

[project.scripts]
uav-swarm-control = "uav_swarm_control.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "gym-pybullet-drones",
    "pre-commit>=4.2",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "scipy>=1.16,<2",
    "scipy-stubs>=1.16,<2",
    "types-pyyaml>=6.0.12.20250822",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["uav_swarm_control"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
show_missing = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.uv.sources]
gym-pybullet-drones = { git = "https://github.com/utiasDSL/gym-pybullet-drones.git", rev = "24fccff4da746badb6eaa9f5055cd5d9b6613160" }
