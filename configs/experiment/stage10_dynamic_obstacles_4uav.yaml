# Stage 10 controlled oracle-obstacle study; smoke mode validates plumbing only.
schema_version: 1
name: stage10-dynamic-obstacles-4uav
seed: 11
formation:
  kind: plane
  num_agents: 4
  spacing_m: 0.6
  center_m: [0.0, 0.0, 2.0]
  euler_radians: [0.0, 0.0, 0.0]
environment:
  time_step_seconds: 0.03333333333333333
  max_episode_steps: 360
  max_velocity_component_mps: 0.5
observation:
  max_neighbors: 3
  neighbor_radius_m: null
task:
  initial_center_m: [-1.4, 0.0, 1.6]
  initial_position_noise_m: 0.05
  success_tolerance_m: 0.12
  success_hold_steps: 15
  collision_distance_m: 0.2
  terminate_on_collision: true
reward:
  navigation_weight: 10.0
  formation_weight: 1.0
  collision_penalty: 2.0
  smoothness_weight: 0.0
  success_bonus: 0.0
controller:
  gain_per_second: 1.5
simulator:
  drone_model: cf2x
  physics: pyb_gnd_drag_dw
  physics_frequency_hz: 240
  control_frequency_hz: 30
  gui: false
  record_video: false
algorithm:
  total_steps: 10000000
  rollout_steps: 1000
  num_environments: 20
  update_epochs: 4
  minibatch_size: 250
  learning_rate: 0.0005
  gamma: 0.99
  gae_lambda: 0.95
  clip_coefficient: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.001
  max_gradient_norm: 0.5
  hidden_sizes: [256, 256]
  critic_hidden_sizes: [256, 256]
  initial_log_standard_deviation: -0.5
  device: auto
evaluation:
  episodes: 20
obstacle_study:
  pose:
    center_offset_lower_m: [-0.1, -0.1, -0.1]
    center_offset_upper_m: [0.1, 0.1, 0.1]
    euler_offset_lower_radians: [-0.2, -0.2, -0.3]
    euler_offset_upper_radians: [0.2, 0.2, 0.3]
    scale_lower: 0.95
    scale_upper: 1.05
  variant:
    name: minimum-target
    assignment: minimum-distance
    coordinate_frame: target
  field:
    max_obstacles: 3
    static_count: 2
    slow_dynamic_count: 2
    mixed_count: 3
    vehicle_radius_m: 0.06
    radius_lower_m: 0.12
    radius_upper_m: 0.18
    speed_lower_mps: 0.12
    speed_upper_mps: 0.2
    route_fraction_lower: 0.3
    route_fraction_upper: 0.7
    static_lateral_lower_m: 0.0
    static_lateral_upper_m: 0.4
    dynamic_lateral_lower_m: 0.4
    dynamic_lateral_upper_m: 0.65
    vertical_offset_lower_m: -0.15
    vertical_offset_upper_m: 0.15
    mixed_dynamic_probability: 0.67
    observation_radius_m: null
    safety_margin_m: 0.2
    proximity_weight: 0.5
    collision_penalty: 5.0
  training_regimens:
    - name: no-obstacle-control
      role: no-obstacle-control
      phases:
        - {end_fraction: 1.0, scenario: no-obstacle}
    - name: static-control
      role: static-control
      phases:
        - {end_fraction: 1.0, scenario: static}
    - name: staged-curriculum
      role: curriculum
      phases:
        - {end_fraction: 0.1, scenario: no-obstacle}
        - {end_fraction: 0.35, scenario: static}
        - {end_fraction: 0.65, scenario: slow-dynamic}
        - {end_fraction: 1.0, scenario: mixed-dynamic}
  evaluation_scenarios: [no-obstacle, static, slow-dynamic, mixed-dynamic]
protocol:
  training_seeds: [11, 22, 33, 44, 55]
  evaluation_seed: 20260910
  profile: research
