schema_version: 1
name: ppo-continuous-bandit
seed: 42

task:
  target_low: -0.8
  target_high: 0.8
  success_tolerance: 0.1
  evaluation_episodes: 256

algorithm:
  total_steps: 4096
  rollout_steps: 256
  update_epochs: 8
  minibatch_size: 64
  learning_rate: 0.003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coefficient: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.0
  max_gradient_norm: 0.5
  hidden_sizes: [32, 32]
  initial_log_standard_deviation: -0.5
  device: cpu
