schema_version: 1
name: triangle-kinematic-smoke
seed: 20260905

formation:
  kind: triangle
  num_agents: 3
  spacing_m: 1.0
  center_m: [0.0, 0.0, 1.0]
  euler_radians: [0.0, 0.0, 0.0]

environment:
