schema_version: 1
name: mappo-triangle-kinematic
seed: 42

formation:
  kind: triangle
  num_agents: 3
  spacing_m: 1.0
  center_m: [0.0, 0.0, 1.0]
  euler_radians: [0.0, 0.0, 0.0]

environment:
  time_step_seconds: 0.1
  max_episode_steps: 64
  max_velocity_component_mps: 1.0

observation:
  max_neighbors: 2
  neighbor_radius_m: null

task:
  initial_center_m: [-1.0, 0.0, 1.0]
  initial_position_noise_m: 0.05
  success_tolerance_m: 0.1
  success_hold_steps: 3
  collision_distance_m: 0.2
  terminate_on_collision: false

reward:
  navigation_weight: 1.0
  formation_weight: 0.25
  collision_penalty: 2.0
  smoothness_weight: 0.01
  success_bonus: 5.0

controller:
  gain_per_second: 1.5

algorithm:
  total_steps: 65536
  rollout_steps: 256
  num_environments: 4
  update_epochs: 4
  minibatch_size: 256
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coefficient: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.001
  max_gradient_norm: 0.5
  hidden_sizes: [64, 64]
  critic_hidden_sizes: [128, 128]
  initial_log_standard_deviation: -0.5
  device: cpu

evaluation:
  episodes: 20
